<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The concept is the product: a chain of services that looks intact, until you look
       through the glass and find the link that broke.

       Sized to survive 48px, which is where Community Applications draws it. Nothing
       thinner than ~14 units, and the silhouette carries the meaning even when the
       interior detail dissolves.

       Gradients on the chain use userSpaceOnUse deliberately: a horizontal line has a
       zero-height bounding box, and an objectBoundingBox gradient on one degenerates and
       renders nothing at all. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#262b34"/>
      <stop offset="0.55" stop-color="#181b21"/>
      <stop offset="1" stop-color="#0f1114"/>
    </linearGradient>

    <linearGradient id="rim" x1="120" y1="110" x2="330" y2="330"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9ad2ff"/>
      <stop offset="0.5" stop-color="#5aa9e6"/>
      <stop offset="1" stop-color="#2b6791"/>
    </linearGradient>

    <radialGradient id="glass" cx="0.34" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#8ecbff" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#8ecbff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.30"/>
    </radialGradient>

    <clipPath id="lens">
      <circle cx="206" cy="206" r="116"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#tile)"/>

  <!-- The chain as it appears from outside: four links, apparently fine. -->
  <g fill="none" stroke="#3f6f97" stroke-width="30" stroke-linecap="round">
    <path d="M40 206 H120"/>
    <path d="M152 206 H250"/>
    <path d="M282 206 H384"/>
    <path d="M416 206 H472"/>
  </g>

  <!-- What the glass reveals: the same chain, severed. -->
  <g clip-path="url(#lens)">
    <rect x="88" y="88" width="236" height="236" fill="#0b0d10"/>
    <!-- The two ends spring apart, the way a snapped cable does. A gap alone would read
         as a dashed line; the vertical offset is what makes it read as broken. -->
    <g fill="none" stroke="#e4685d" stroke-width="34" stroke-linecap="round"
       stroke-linejoin="round">
      <path d="M88 206 H160 L188 172"/>
      <path d="M334 206 H262 L234 240"/>
    </g>
  </g>

  <!-- Glass over the top: faint sheen, then a highlight arc. -->
  <circle cx="206" cy="206" r="116" fill="url(#glass)"/>
  <path d="M136 152 A116 116 0 0 1 232 96" fill="none" stroke="#ffffff"
        stroke-opacity="0.28" stroke-width="15" stroke-linecap="round"/>

  <!-- Rim and handle sit above everything else. -->
  <circle cx="206" cy="206" r="116" fill="none" stroke="url(#rim)" stroke-width="32"/>
  <path d="M296 296 L438 438" stroke="#22526f" stroke-width="56" stroke-linecap="round"/>
  <path d="M296 296 L438 438" stroke="url(#rim)" stroke-width="38" stroke-linecap="round"/>
</svg>
