<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Deliberately bold and geometric: Community Applications renders this at roughly
       48px, so fine detail would disappear. Palette matches the app itself. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22262e"/>
      <stop offset="1" stop-color="#14161a"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="52" fill="url(#bg)"/>

  <!-- The chain of services, with the third link broken -- the thing Sleutharr finds. -->
  <g stroke="#2f6d99" stroke-width="13" fill="none" stroke-linecap="round">
    <path d="M44 196 L74 196"/>
    <path d="M96 196 L126 196"/>
  </g>
  <path d="M148 196 L163 196" stroke="#e4685d" stroke-width="13" stroke-linecap="round"/>
  <path d="M185 196 L212 196" stroke="#2b3038" stroke-width="13" stroke-linecap="round"/>

  <!-- Magnifying glass over the break. -->
  <circle cx="118" cy="106" r="58" fill="#14161a" fill-opacity="0.75"
          stroke="#5aa9e6" stroke-width="16"/>
  <path d="M160 148 L206 194" stroke="#5aa9e6" stroke-width="20" stroke-linecap="round"/>

  <!-- Play mark inside the lens: this is about media, not generic search. -->
  <path d="M104 82 L146 106 L104 130 Z" fill="#5aa9e6"/>
</svg>
